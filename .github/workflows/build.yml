name: Build al-folio preview

on:
  push:
    branches: [al-folio]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: >-
          docker run --rm
          -v "$PWD:/srv/jekyll"
          -w /srv/jekyll
          -e JEKYLL_ENV=production
          --entrypoint bundle
          amirpourmand/al-folio:v0.14.0
          exec jekyll build --trace
      - uses: actions/upload-artifact@v4
        with:
          name: al-folio-preview
          path: _site
