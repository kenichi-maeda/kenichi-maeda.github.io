services:
  jekyll:
    image: amirpourmand/al-folio:v0.14.0
    working_dir: /srv/jekyll
    entrypoint: []
    command: bundle exec jekyll serve --host 0.0.0.0 --port 8080 --force_polling --destination /tmp/site
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - .:/srv/jekyll:ro
    tmpfs:
      - /tmp
    environment:
      JEKYLL_ENV: development
